# Plugins or the download page changed (no new app version): rebuild the site with the
# installer that is already online and deploy it.
name: site

on:
  push:
    branches: [main]
    paths: ['plugins/**', 'site/**', 'scripts/build-site.mjs', 'scripts/build-plugins.mjs']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
