# Release: push a tag vX.Y.Z (pnpm release ...) -> build the Windows installer,
# publish the download site + update feed on GitHub Pages, keep a GitHub Release record.
# The github-pages environment accepts deployments from main only, so this runs twice:
#   tag run  : checks, build, GitHub Release record, then starts the run on main
#   main run : checks, build, download site + update feed (Pages)
# If the run on main does not appear after a tag run: gh workflow run release.yml --ref main
# Only the newest version is kept: older GitHub Releases (and their installers) are deleted,
# the Pages artifact expires after a day (artifact storage quota).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write
  actions: write

# One Pages deployment at a time (group "release", shared with site.yml). The tag run is in
# a group of its own: it starts the run on main while it is still running itself, and a run
# that has to wait for the very run that started it was once left queued for good (v1.1.0).
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'release-tag' || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # the key of the feedback GitHub App is sealed into the installer (scripts/build-feedback.mjs)
      - run: pnpm build
        env:
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_KEY: ${{ secrets.FEEDBACK_APP_KEY }}
          FEEDBACK_INSTALLATION_ID: ${{ secrets.FEEDBACK_INSTALLATION_ID }}
      # Code signing (optional): with the repository secrets CSC_LINK (base64 of the .pfx, or an
      # https link to it) and CSC_KEY_PASSWORD the installer and TeamHub.exe are signed, which is
      # what stops SmartScreen and security programs from flagging them. Without the secrets the
      # build is unsigned as before (docs/manual/98-exception-request.md).
      - run: pnpm exec electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Signature and hash of the installer (shown in the run log)
        shell: pwsh
        run: |
          $f = Get-ChildItem release/TeamHub-Setup-*.exe | Select-Object -First 1
          $s = Get-AuthenticodeSignature $f.FullName
          "signature: $($s.Status) $($s.SignerCertificate.Subject)"
          "sha256: $((Get-FileHash $f.FullName -Algorithm SHA256).Hash)"
      - name: Release notes from the tag message
        shell: bash
        run: |
          t="${GITHUB_REF_NAME}"
          # run by hand on a branch: use the newest tag's notes
          git rev-parse -q --verify "refs/tags/$t" >/dev/null || t=$(git describe --tags --abbrev=0)
          {
            echo 'RELEASE_NOTES<<__EOF__'
            git tag -l --format='%(contents)' "$t" | sed '/-----BEGIN/,$d'
            echo '__EOF__'
          } >> "$GITHUB_ENV"
      - name: GitHub Release (version record)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          printf '%s' "$RELEASE_NOTES" > notes.txt
          gh release create "${GITHUB_REF_NAME}" "release/TeamHub-Setup-$v.exe" release/latest.yml --title "TeamHub ${GITHUB_REF_NAME}" --notes-file notes.txt ||           gh release upload "${GITHUB_REF_NAME}" "release/TeamHub-Setup-$v.exe" release/latest.yml --clobber
      - name: Keep only the newest release (delete older releases and their files; tags stay)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r t; do
            [ "$t" = "${GITHUB_REF_NAME}" ] && continue
            echo "delete release $t"
            gh release delete "$t" --yes
          done
      # the site last: if the Pages artifact cannot be stored (quota), the release record above is still made
      - name: Publish the download site from main (tag runs may not deploy to Pages)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/build-site.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Only the newest build is kept anywhere: the Pages artifacts of earlier runs still hold
      # the installers of earlier versions (and count against the artifact storage quota).
      - name: Delete the build artifacts of earlier runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' | while read -r id; do
            echo "delete artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
