# Plugins or the download page changed (no new app version), or a feature request / bug report
# was posted, answered or closed: rebuild the site with the installer that is already online
# and deploy it. The board page (feedback.html) shows feedback.json, exported from the issues
# here because the page cannot read the issues of a private repository itself.
name: site

on:
  push:
    branches: [main]
    paths: ['plugins/**', 'site/**', 'scripts/build-site.mjs', 'scripts/build-plugins.mjs']
  # opened / edited / reopened / labeled start the intake workflow first; the board is rebuilt when
  # that is done (what a workflow changes with its own token starts no other workflow by itself)
  issues:
    types: [closed, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [feedback-intake]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/build-site.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          FEEDBACK_SEAL_KEY: ${{ secrets.FEEDBACK_SEAL_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Only the newest build is kept anywhere: the Pages artifacts of earlier runs still hold
      # the installers of earlier versions (and count against the artifact storage quota).
      - name: Delete the build artifacts of earlier runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' | while read -r id; do
            echo "delete artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
