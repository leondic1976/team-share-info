<!doctype html>
<html lang="ko" class="th-ui">
  <head>
    <meta charset="utf-8" />
    <title>N분의 1 정산</title>
    <link rel="stylesheet" href="style.css" />
    <script src="__sdk.js"></script>
  </head>
  <body>
    <div class="th-page">
      <header class="th-page-header">
        <div>
          <h1>N분의 1 정산</h1>
          <p>회식비·경비를 인원수나 항목별로 나누고, 누가 누구에게 얼마를 보내면 되는지 계산합니다. 이 PC에만 저장됩니다.</p>
        </div>
      </header>
      <div class="th-toolbar">
        <nav class="th-tabs" role="tablist" aria-label="보기">
          <button class="th-btn th-tab" role="tab" data-tab="quick" aria-selected="true"><i data-icon="calculator"></i> 간단 N빵</button>
          <button class="th-btn th-tab" role="tab" data-tab="items" aria-selected="false"><i data-icon="receipt"></i> 항목별 정산</button>
          <button class="th-btn th-tab" role="tab" data-tab="history" aria-selected="false"><i data-icon="history"></i> 기록</button>
        </nav>
      </div>

      <main class="th-body">
        <div class="stack">
          <!-- 간단 N빵 -->
          <section id="quick" class="cols">
            <div class="th-card">
              <div class="th-card-header"><h2 class="th-card-title">나눌 금액</h2><span class="th-xs th-muted">금액은 187,500 · 18.7만 · 3천처럼 적어도 됩니다.</span></div>
              <div class="th-card-body form">
                <div class="th-field">
                  <label class="th-label" for="qTitle">무엇을 나누나요 <small>(선택)</small></label>
                  <input class="th-input" id="qTitle" maxlength="60" placeholder="예: 3월 팀 회식" />
                </div>
                <div class="pair">
                  <div class="th-field">
                    <label class="th-label" for="qTotal">총 금액</label>
                    <input class="th-input" id="qTotal" inputmode="numeric" placeholder="예: 187,500 또는 18.7만" />
                  </div>
                  <div class="th-field">
                    <label class="th-label" for="qPeople">인원</label>
                    <div class="stepper">
                      <button type="button" class="th-btn th-btn-outline th-btn-icon" id="qMinus" aria-label="한 명 줄이기">−</button>
                      <input class="th-input" id="qPeople" type="number" min="1" max="999" value="4" aria-label="인원" />
                      <button type="button" class="th-btn th-btn-outline th-btn-icon" id="qPlus" aria-label="한 명 늘리기">+</button>
                    </div>
                  </div>
                </div>
                <div class="th-chips" id="qAdd" aria-label="금액 더하기">
                  <button type="button" class="th-chip" data-add="1000">+1천</button>
                  <button type="button" class="th-chip" data-add="5000">+5천</button>
                  <button type="button" class="th-chip" data-add="10000">+1만</button>
                  <button type="button" class="th-chip" data-add="50000">+5만</button>
                  <button type="button" class="th-chip" data-add="0">지우기</button>
                </div>
                <div class="th-field">
                  <label class="th-label" for="qDeduct">먼저 뺄 금액 <small>(지원금·회비·쿠폰, 선택)</small></label>
                  <input class="th-input" id="qDeduct" inputmode="numeric" placeholder="예: 50,000" />
                </div>
                <div class="pair">
                  <div class="th-field">
                    <label class="th-label" for="qExtraPayers">더 내는 사람 수 <small>(선택)</small></label>
                    <input class="th-input" id="qExtraPayers" type="number" min="0" max="999" value="0" />
                  </div>
                  <div class="th-field">
                    <label class="th-label" for="qExtra">한 사람이 더 내는 금액</label>
                    <input class="th-input" id="qExtra" inputmode="numeric" placeholder="예: 20,000 (덜 내면 -5,000)" />
                  </div>
                </div>
                <div class="pair">
                  <div class="th-field">
                    <label class="th-label" for="qUnit">금액 단위</label>
                    <select id="qUnit" class="th-input unit"></select>
                  </div>
                  <div class="th-field">
                    <label class="th-label" for="qMode">단위 맞춤</label>
                    <select id="qMode" class="th-input mode"></select>
                  </div>
                </div>
              </div>
            </div>
            <div class="th-card">
              <div class="th-card-header"><h2 class="th-card-title">결과</h2></div>
              <div class="result" id="qResult" aria-live="polite"></div>
            </div>
          </section>

          <!-- 항목별 정산 -->
          <section id="items" class="cols hidden">
            <div class="stack">
              <div class="th-card">
                <div class="th-card-header head">
                  <h2 class="th-card-title">함께한 사람</h2>
                  <span class="th-xs th-muted">비율: 1 = 보통, 1.5 = 더 냄, 0.5 = 덜 냄</span>
                  <button type="button" class="th-btn th-btn-outline th-btn-sm push" id="loadMembers"><i data-icon="users"></i> 팀원 불러오기</button>
                </div>
                <div class="th-card-body form">
                  <div id="people" class="people"></div>
                  <div class="add-row">
                    <input class="th-input" id="newPerson" maxlength="20" placeholder="이름을 적고 Enter (쉼표로 여러 명)" aria-label="이름" />
                    <button type="button" class="th-btn th-btn-outline" id="addPerson">추가</button>
                  </div>
                </div>
              </div>
              <div class="th-card">
                <div class="th-card-header head">
                  <h2 class="th-card-title">쓴 돈</h2>
                  <span class="th-xs th-muted">항목마다 낸 사람과 함께한 사람을 고릅니다.</span>
                  <button type="button" class="th-btn th-btn-sm push" id="addExpense"><i data-icon="plus"></i> 항목 추가</button>
                </div>
                <div id="expenses" class="rows"></div>
              </div>
            </div>
            <div class="th-card">
              <div class="th-card-header"><h2 class="th-card-title">정산 결과</h2></div>
              <div class="th-card-body form opts">
                <div class="th-field">
                  <label class="th-label" for="iTitle">정산 이름 <small>(선택)</small></label>
                  <input class="th-input" id="iTitle" maxlength="60" placeholder="예: 워크숍 경비" />
                </div>
                <div class="pair">
                  <div class="th-field">
                    <label class="th-label" for="iUnit">송금 단위</label>
                    <select id="iUnit" class="th-input unit"></select>
                  </div>
                  <div class="th-field">
                    <label class="th-label" for="iMode">단위 맞춤</label>
                    <select id="iMode" class="th-input mode"></select>
                  </div>
                </div>
              </div>
              <div id="iResult" class="result" aria-live="polite"></div>
            </div>
          </section>

          <!-- 기록 -->
          <section id="history" class="hidden">
            <div class="th-card">
              <div class="th-card-header head">
                <h2 class="th-card-title">기록</h2>
                <span class="th-xs th-muted">복사한 결과가 50개까지 남습니다. 이 PC에만 저장됩니다.</span>
                <button type="button" class="th-btn th-btn-outline th-btn-sm push" id="clearHistory"><i data-icon="trash-2"></i> 기록 지우기</button>
              </div>
              <div id="historyList" class="rows"></div>
            </div>
          </section>

          <div class="th-card account">
            <div class="th-card-body">
              <div class="th-field">
                <label class="th-label" for="account">받을 계좌 <small>(복사할 때 함께 넣습니다. 이 PC에만 저장)</small></label>
                <input class="th-input" id="account" maxlength="80" placeholder="예: ○○은행 123-456-789012 홍길동" />
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" class="th-toast" role="status"></div>
    <script src="dutch.js"></script>
    <script src="app.js"></script>
  </body>
</html>
