<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>사다리타기</title>
    <link rel="stylesheet" href="style.css" />
    <script src="__sdk.js"></script>
  </head>
  <body>
    <header>
      <h1><i data-icon="ladder"></i> 사다리타기</h1>
      <nav role="tablist">
        <button role="tab" data-tab="quick" aria-selected="true">바로 하기</button>
        <button role="tab" data-tab="together">팀원과 함께</button>
        <button role="tab" data-tab="history">기록</button>
      </nav>
    </header>

    <main>
      <!-- 바로 하기 / 방 만들기 공통 설정 -->
      <section id="setup" class="panel">
        <div class="row">
          <div class="col">
            <label for="people">참여자 <small>(줄바꿈이나 쉼표로 구분, 2~30명)</small></label>
            <textarea id="people" rows="6" placeholder="김주무관&#10;이주무관&#10;박주무관"></textarea>
            <div class="btns">
              <button id="loadMembers" class="ghost">팀원 불러오기</button>
              <button id="shufflePeople" class="ghost">참여자 순서 섞기</button>
              <span id="peopleCount" class="muted"></span>
            </div>
          </div>
          <div class="col">
            <label for="preset">결과 종류</label>
            <select id="preset">
              <option value="winner">당첨 고르기 (당첨 N명, 나머지 꽝)</option>
              <option value="order">순서 정하기 (1등 ~ N등)</option>
              <option value="teams">팀 나누기 (A팀·B팀…)</option>
              <option value="coffee">커피 몰아주기 (1명이 쏜다)</option>
              <option value="penalty">벌칙 정하기</option>
              <option value="custom">직접 입력</option>
            </select>
            <div id="presetOpts" class="btns"></div>
            <label for="results">결과 <small>(줄 수만큼, 모자라면 '꽝'으로 채움)</small></label>
            <textarea id="results" rows="4"></textarea>
          </div>
        </div>
        <div class="btns">
          <label class="inline"><input type="checkbox" id="hide" checked /> 결과 가리기(하나씩 공개)</label>
          <label class="inline">가로줄
            <select id="density">
              <option value="8">적게</option>
              <option value="12" selected>보통</option>
              <option value="18">많게</option>
            </select>
          </label>
          <span class="grow"></span>
          <button id="start" class="primary">사다리 만들기</button>
        </div>
        <div id="roomOpts" class="together-only">
          <hr />
          <label for="roomTitle">방 이름</label>
          <input id="roomTitle" placeholder="예: 오늘 커피 내기" maxlength="100" />
          <label class="inline"><input type="checkbox" id="everyone" /> 팀 전체에 공개(초대 알림 없이 목록에만)</label>
          <p class="muted">참여자에 적은 이름이 팀원 이름과 같으면 그 팀원에게 초대가 갑니다. 각자 자기 출발점을 고르고, 모두 고르면 만든 사람이 결과를 공개합니다.</p>
          <button id="createRoom" class="primary">방 만들고 초대</button>
        </div>
      </section>

      <!-- 함께하기: 방 목록 -->
      <section id="rooms" class="panel together-only">
        <div class="btns"><h2>진행 중인 방</h2><span class="grow"></span><button id="refreshRooms" class="ghost">새로 고침</button></div>
        <div id="roomList"></div>
      </section>

      <!-- 사다리 -->
      <section id="board" class="panel hidden">
        <div class="btns">
          <h2 id="boardTitle">사다리</h2>
          <span class="grow"></span>
          <span id="boardStatus" class="muted"></span>
        </div>
        <div id="ladderWrap"><svg id="ladder" role="img" aria-label="사다리"></svg></div>
        <div class="btns" id="boardBtns">
          <button id="revealAll" class="primary">모두 공개</button>
          <button id="reshuffle" class="ghost">다시 섞기</button>
          <button id="copyResult" class="ghost">결과 복사</button>
          <button id="backSetup" class="ghost">처음으로</button>
        </div>
        <div id="resultTable"></div>
        <p class="muted small" id="fair"></p>
      </section>

      <section id="history" class="panel hidden">
        <div class="btns"><h2>기록</h2><span class="grow"></span><button id="clearHistory" class="ghost">기록 지우기</button></div>
        <div id="historyList"></div>
      </section>
    </main>
    <div id="toast" role="status"></div>
    <script src="ladder.js"></script>
    <script src="app.js"></script>
  </body>
</html>
