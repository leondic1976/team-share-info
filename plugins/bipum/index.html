<!doctype html>
<html lang="ko" class="th-ui">
  <head>
    <meta charset="utf-8" />
    <title>비품관리대장</title>
    <link rel="stylesheet" href="style.css" />
    <script src="__sdk.js"></script>
  </head>
  <body>
    <div class="th-page">
      <header class="th-page-header">
        <div>
          <h1>비품관리대장</h1>
          <p>사무실 비품과 소모품을 팀이 함께 보는 대장으로 관리하고, 대여·지급과 재물조사를 기록합니다.</p>
        </div>
        <div class="th-actions">
          <select id="bookSel" class="th-input hidden" aria-label="대장 고르기"></select>
          <button id="manageBtn" class="th-btn th-btn-outline"><i data-icon="settings"></i> 대장 관리</button>
          <button id="addBtn" class="th-btn hidden"><i data-icon="plus"></i> 물품 등록</button>
        </div>
      </header>
      <div class="th-toolbar" id="bar">
        <nav class="th-tabs" role="tablist" aria-label="보기">
          <button class="th-btn th-tab" role="tab" data-tab="list" aria-selected="true"><i data-icon="archive"></i> 대장</button>
          <button class="th-btn th-tab" role="tab" data-tab="loans" aria-selected="false"><i data-icon="package"></i> 대여·지급</button>
          <button class="th-btn th-tab" role="tab" data-tab="audit" aria-selected="false"><i data-icon="clipboard-list"></i> 재물조사</button>
          <button class="th-btn th-tab" role="tab" data-tab="summary" aria-selected="false"><i data-icon="chart-column"></i> 현황</button>
        </nav>
        <span id="bookInfo" class="th-xs th-muted push"></span>
      </div>

      <div id="printHead" class="th-print-only"></div>
      <main class="th-body" id="main" aria-live="polite"></main>
    </div>

    <!-- item: add / edit (manager) -->
    <dialog id="itemDlg" class="th-dialog wide">
      <form id="itemForm" method="dialog">
        <h2 class="th-dialog-title" id="itemTitle">물품 등록</h2>
        <div class="form">
          <div class="checks" role="radiogroup" aria-label="구분">
            <label class="th-check"><input type="radio" name="iKind" value="0" checked /> 비품 <small>(하나씩 관리하는 물건)</small></label>
            <label class="th-check"><input type="radio" name="iKind" value="1" /> 소모품 <small>(재고를 세는 물건)</small></label>
          </div>
          <div class="pair">
            <div class="th-field">
              <label class="th-label" for="iName">품명</label>
              <input class="th-input" id="iName" maxlength="60" required placeholder="예: 노트북" />
            </div>
            <div class="th-field">
              <label class="th-label" for="iCat">분류</label>
              <input class="th-input" id="iCat" maxlength="20" list="catList" placeholder="예: 전산장비" />
            </div>
          </div>
          <div class="pair">
            <div class="th-field">
              <label class="th-label" for="iSpec">규격·모델</label>
              <input class="th-input" id="iSpec" maxlength="80" placeholder="예: LG gram 16" />
            </div>
            <div class="th-field">
              <label class="th-label" for="iNo">관리번호</label>
              <input class="th-input" id="iNo" maxlength="30" placeholder="예: 2025-전산-001" />
            </div>
          </div>
          <div class="triple">
            <div class="th-field">
              <label class="th-label" for="iQty">수량</label>
              <input class="th-input" id="iQty" type="number" min="0" max="9999999" step="1" value="1" required />
            </div>
            <div class="th-field">
              <label class="th-label" for="iUnit">단위</label>
              <input class="th-input" id="iUnit" maxlength="8" list="unitList" value="개" />
            </div>
            <div class="th-field hidden" id="iMinBox">
              <label class="th-label" for="iMin">최소 재고 <small>(이하면 경고)</small></label>
              <input class="th-input" id="iMin" type="number" min="0" max="9999999" step="1" value="0" />
            </div>
          </div>
          <div class="triple">
            <div class="th-field">
              <label class="th-label" for="iGot">취득일</label>
              <input class="th-input" id="iGot" type="date" />
            </div>
            <div class="th-field">
              <label class="th-label" for="iPrice">취득가액 <small>(1개, 원)</small></label>
              <input class="th-input" id="iPrice" type="number" min="0" step="1" placeholder="0" />
            </div>
            <div class="th-field">
              <label class="th-label" for="iLife">내용연수 <small>(년)</small></label>
              <input class="th-input" id="iLife" type="number" min="0" max="99" step="1" placeholder="0" />
            </div>
          </div>
          <div class="triple">
            <div class="th-field">
              <label class="th-label" for="iLoc">보관 위치</label>
              <input class="th-input" id="iLoc" maxlength="40" list="locList" placeholder="예: 3층 사무실" />
            </div>
            <div class="th-field">
              <label class="th-label" for="iHolder">사용자 <small>(담당자)</small></label>
              <input class="th-input" id="iHolder" maxlength="30" list="holderList" />
            </div>
            <div class="th-field">
              <label class="th-label" for="iStatus">상태</label>
              <select class="th-input" id="iStatus"></select>
            </div>
          </div>
          <label class="th-check" id="iLendBox"><input type="checkbox" id="iLend" /> 대여용 <small>(팀원이 빌려 쓰는 공용 물품)</small></label>
          <div class="th-field">
            <label class="th-label" for="iNote">비고</label>
            <input class="th-input" id="iNote" maxlength="200" />
          </div>
        </div>
        <datalist id="catList"></datalist>
        <datalist id="locList"></datalist>
        <datalist id="holderList"></datalist>
        <datalist id="unitList">
          <option value="개"></option>
          <option value="대"></option>
          <option value="박스"></option>
          <option value="권"></option>
          <option value="세트"></option>
          <option value="자루"></option>
          <option value="통"></option>
          <option value="장"></option>
        </datalist>
        <p id="itemError" class="th-error" role="alert"></p>
        <div class="dlg-btns">
          <span class="th-grow"></span>
          <button type="button" class="th-btn th-btn-outline" data-close>취소</button>
          <button type="submit" class="th-btn">저장</button>
        </div>
      </form>
    </dialog>

    <!-- item: details, history, actions -->
    <dialog id="detailDlg" class="th-dialog wide">
      <div id="detailBody"></div>
    </dialog>

    <!-- lend / issue -->
    <dialog id="loanDlg" class="th-dialog narrow">
      <form id="loanForm" method="dialog">
        <h2 class="th-dialog-title" id="loanTitle">대여</h2>
        <div class="form">
          <p id="loanItem" class="th-muted"></p>
          <div class="pair">
            <div class="th-field">
              <label class="th-label" for="lQty">수량</label>
              <input class="th-input" id="lQty" type="number" min="1" step="1" value="1" required />
            </div>
            <div class="th-field" id="lDueBox">
              <label class="th-label" for="lDue">반납 예정일 <small>(선택)</small></label>
              <input class="th-input" id="lDue" type="date" />
            </div>
          </div>
          <div class="th-field hidden" id="lWhoBox">
            <label class="th-label" for="lWho">받는 사람 <small>(담당자가 대신 기록)</small></label>
            <select class="th-input" id="lWho"></select>
          </div>
          <div class="th-field">
            <label class="th-label" for="lNote">비고 <small>(선택)</small></label>
            <input class="th-input" id="lNote" maxlength="200" placeholder="예: 외부 회의용" />
          </div>
        </div>
        <p id="loanError" class="th-error" role="alert"></p>
        <div class="dlg-btns">
          <span class="th-grow"></span>
          <button type="button" class="th-btn th-btn-outline" data-close>취소</button>
          <button type="submit" class="th-btn" id="loanSubmit">대여</button>
        </div>
      </form>
    </dialog>

    <!-- stock of a consumable (manager) -->
    <dialog id="stockDlg" class="th-dialog narrow">
      <form id="stockForm" method="dialog">
        <h2 class="th-dialog-title">입고·재고 조정</h2>
        <div class="form">
          <p id="stockItem" class="th-muted"></p>
          <div class="checks col">
            <label class="th-check"><input type="radio" name="sMode" value="in" checked /> 입고 <small>(지금 재고에 더함)</small></label>
            <label class="th-check"><input type="radio" name="sMode" value="set" /> 재고 조정 <small>(세어 본 수량으로 맞춤)</small></label>
          </div>
          <div class="th-field">
            <label class="th-label" for="sQty">수량</label>
            <input class="th-input" id="sQty" type="number" min="0" max="9999999" step="1" required />
          </div>
        </div>
        <p id="stockError" class="th-error" role="alert"></p>
        <div class="dlg-btns">
          <span class="th-grow"></span>
          <button type="button" class="th-btn th-btn-outline" data-close>취소</button>
          <button type="submit" class="th-btn">저장</button>
        </div>
      </form>
    </dialog>

    <!-- register: info, new, backup, delete -->
    <dialog id="manageDlg" class="th-dialog">
      <div id="manageBody"></div>
    </dialog>
    <dialog id="newDlg" class="th-dialog">
      <form id="newForm" method="dialog">
        <h2 class="th-dialog-title">새 대장 만들기</h2>
        <div class="form">
          <p class="th-hint">대장을 만든 사람이 담당자가 되어 물품을 등록·수정합니다. 볼 수 있는 사람은 찾아보고 대여·지급·재물조사를 기록할 수 있습니다.</p>
          <div class="th-field">
            <label class="th-label" for="nTitle">대장 이름</label>
            <input class="th-input" id="nTitle" maxlength="40" required placeholder="예: 총무팀 비품관리대장" />
          </div>
          <div class="th-field">
            <span class="th-label">볼 수 있는 사람</span>
            <div class="checks col">
              <label class="th-check"><input type="radio" name="nScope" value="team" checked /> 팀 전체</label>
              <label class="th-check"><input type="radio" name="nScope" value="members" /> 지정한 사람 <small>(초대 알림이 갑니다. 나중에 바꿀 수 없습니다)</small></label>
            </div>
            <div id="nMembers" class="members hidden"></div>
          </div>
          <div class="th-field">
            <span class="th-label">처음 내용</span>
            <div class="btns start">
              <button type="button" class="th-btn th-btn-outline th-btn-sm" id="nBackup"><i data-icon="import"></i> 백업 파일에서 가져오기</button>
              <span id="nBackupInfo" class="th-hint">고르지 않으면 빈 대장으로 시작합니다. 엑셀 자료는 만든 뒤 [CSV 가져오기]로 넣습니다.</span>
            </div>
          </div>
        </div>
        <p id="newError" class="th-error" role="alert"></p>
        <div class="dlg-btns">
          <span class="th-grow"></span>
          <button type="button" class="th-btn th-btn-outline" data-close>취소</button>
          <button type="submit" class="th-btn">만들기</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="th-toast" role="status"></div>
    <script src="bipum.js"></script>
    <script src="app.js"></script>
  </body>
</html>
