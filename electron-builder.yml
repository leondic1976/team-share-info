appId: kr.teamhub.app
productName: TeamHub
copyright: TeamHub
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources
    to: resources
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  executableName: TeamHub
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  artifactName: TeamHub-Setup-${version}.${ext}
  shortcutName: TeamHub
  uninstallDisplayName: TeamHub
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
# The feed URL is replaced at runtime with the server PC address (8.2).
publish:
  - provider: generic
    url: http://127.0.0.1:47800/updates/
