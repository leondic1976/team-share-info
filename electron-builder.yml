appId: kr.teamhub.app
productName: TeamHub
copyright: TeamHub
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources
    to: resources
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  executableName: TeamHub
  # A signing certificate is used when the build has one (CSC_LINK + CSC_KEY_PASSWORD, see
  # release.yml); without it the build is unsigned as before.
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
# teamhub:// links from the download site open the app (registered by the installer).
protocols:
  - name: TeamHub
    schemes: [teamhub]
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  # Per-user install never elevates, so elevate.exe is not needed. Left in, that unsigned
  # helper is what many security programs flag (HackTool/RiskWare).
  packElevateHelper: false
  artifactName: TeamHub-Setup-${version}.${ext}
  shortcutName: TeamHub
  uninstallDisplayName: TeamHub
  # Only at the first install. "always" wrote to the Desktop again at every update, which
  # Windows ransomware protection (controlled folder access) reports as a blocked change.
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
# Default feed: the public download site. At runtime the app may switch to the
# server PC feed (closed networks), see src/main/updater.ts.
publish:
  - provider: generic
    url: https://leondic1976.github.io/team-share-info/updates/
